<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моє Портфоліо</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Montserrat',sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      color:white;
      background:
      radial-gradient(circle at top,#4c1d95 0%,#1e1b4b 35%,#020617 100%);
    }

    canvas{
      position:fixed;
      inset:0;
      z-index:-1;
    }

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:72px;
      font-weight:900;
      text-shadow:
      0 0 20px rgba(168,85,247,0.8),
      0 0 40px rgba(168,85,247,0.5);
      margin-bottom:20px;
      animation:float 3s ease-in-out infinite;
    }

    .subtitle{
      color:#d8b4fe;
      margin-bottom:60px;
      font-size:20px;
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:25px;
      justify-content:center;
    }

    .btn{
      width:220px;
      height:80px;
      border:none;
      border-radius:25px;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      color:white;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border:2px solid rgba(255,255,255,0.15);
      transition:0.35s;
      box-shadow:0 0 15px rgba(168,85,247,0.25);
    }

    .btn:hover{
      transform:scale(1.08);
      box-shadow:
      0 0 20px #a855f7,
      0 0 40px #7e22ce;
      background:rgba(168,85,247,0.18);
    }

    .panel{
      display:none;
      margin-top:50px;
      width:90%;
      max-width:800px;
      padding:35px;
      border-radius:30px;
      background:rgba(15,23,42,0.7);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      animation:fade 0.4s ease;
    }

    .panel.active{
      display:block;
    }

    .bio-text p{
      font-size:24px;
      margin:18px 0;
      color:#f5d0fe;
    }

    .anime-gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:20px;
      margin-top:35px;
    }

    .anime-gallery img{
      width:100%;
      height:260px;
      object-fit:cover;
      border-radius:20px;
      transition:0.4s;
      border:2px solid rgba(255,255,255,0.15);
    }

    .anime-gallery img:hover{
      transform:scale(1.05) rotate(1deg);
      box-shadow:0 0 25px #a855f7;
    }

    .easter{
      text-align:center;
    }

    .secret-number{
      font-size:110px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .part14{
      transition:1s;
    }

    .fly-away{
      transform:translateY(-250px) rotate(-40deg);
      opacity:0;
    }

    .part88{
      transition:0.8s;
      color:#c084fc;
      text-shadow:0 0 20px #a855f7;
    }

    .message{
      margin-top:20px;
      font-size:28px;
      color:#f0abfc;
      opacity:0;
      transition:0.8s;
    }

    .message.show{
      opacity:1;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-12px);
      }
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0px);
      }
    }

    @media(max-width:700px){
      h1{
        font-size:48px;
      }

      .secret-number{
        font-size:70px;
      }

      .btn{
        width:180px;
        height:70px;
      }
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<section class="hero">
  <h1>Моє Портфоліо</h1>
  <div class="subtitle">Космічний пробний сайт ✨</div>

  <div class="buttons">
    <button class="btn" onclick="showPanel('bio')">BIO</button>
    <button class="btn" onclick="showPanel('easter')">Посхалка</button>
    <button class="btn" onclick="discordLink()">Discord</button>
  </div>

  <div id="bio" class="panel">
    <div class="bio-text">
      <p>_Я студент і це мій пробний сайт_</p>
      <p>_Мені 16 років_</p>
      <p>_Люблю котів і меми з ними_</p>
      <p>_Люблю гроші і поспати_</p>
    </div>

    <div class="anime-gallery">
      <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=900&auto=format&fit=crop" alt="anime">

      <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=900&auto=format&fit=crop" alt="anime">

      <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=900&auto=format&fit=crop" alt="anime">
    </div>
  </div>

  <div id="easter" class="panel easter">
    <h2 style="font-size:42px; margin-bottom:15px;">Таємна посхалка 👀</h2>

    <p style="color:#d8b4fe;">Натисни на цифри</p>

    <div class="secret-number" onclick="activateSecret()">
      <span class="part14" id="part14">14</span>
      <span class="part88" id="part88">88</span>
    </div>

    <div class="message" id="message">
      Abdulccik 😎
    </div>
  </div>
</section>

<script>
  function showPanel(id){
    document.querySelectorAll('.panel').forEach(panel=>{
      panel.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');
  }

  function activateSecret(){
    document.getElementById('part14').classList.add('fly-away');
    document.getElementById('message').classList.add('show');
  }

  function discordLink(){
    alert('Сюди потім вставиш своє посилання Discord 😄');
  }

  const canvas=document.getElementById('stars');
  const ctx=canvas.getContext('2d');

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

  const stars=[];

  for(let i=0;i<160;i++){
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*2,
      d:Math.random()*0.5
    });
  }

  function drawStars(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle='white';

    stars.forEach(star=>{
      ctx.beginPath();
      ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
      ctx.fill();

      star.y+=star.d;

      if(star.y>canvas.height){
        star.y=0;
        star.x=Math.random()*canvas.width;
      }
    });

    requestAnimationFrame(drawStars);
  }

  drawStars();

  window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  });
</script>

</body>
</html>
